services:
  
  backend:
   build: ./backend
   container_name: expense-backend
   restart: unless-stopped
   env_file:
    - ./backend/.env.docker
   networks:
    - expense-net

   healthcheck:
     test: [ "CMD", "curl", "-f", "http://localhost:8080/health"]
     interval: 10s
     timeout: 5s
     retries: 5
     start_period: 20s

  mysql:
   image: mysql:8.0
   container_name: expense-mysql
   healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
   restart: unless-stopped
   env_file:
    - ./backend/.env
   volumes:
     - expense-mysql-data:/var/lib/mysql
     - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
   networks:
    - expense-net

  frontend:
    build: ./frontend
    container_name: expense-frontend
    healthcheck:
     test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
     interval: 10s
     timeout: 5s
     retries: 3
     start_period: 10s
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
     - expense-net

    





networks:
  expense-net:

volumes:
  expense-mysql-data:
 