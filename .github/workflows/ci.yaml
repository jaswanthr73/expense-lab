name: Expense CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
       - name: checkout repository
         uses: actions/checkout@v4  
       - name: Set up Node.js
         uses: actions/setup-node@v4
         with:
           node-version: 20
       - name: Install backend dependencies
         working-directory: backend
         run: npm ci

       - name: Run backend tests
         working-directory: backend
         env:
          APP_LOG_PATH: /tmp/expense-test-app.log
         run: npm test 